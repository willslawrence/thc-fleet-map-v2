name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One group, so writes to gh-pages stay serialized. cancel-in-progress is TRUE
# so a newer push supersedes an older queued deploy instead of stacking behind
# it: each run republishes the whole site, so the newest is always the only one
# worth waiting for. Was false until 2026-08-06, when a pages-build-deployment
# run stuck for 3h47m backed up every deploy behind it — main carried a corrected
# HZTH58 location for over an hour while gh-pages kept serving the old one.
concurrency:
  group: pages-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish main to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
          clean-exclude: |
            pr-preview/**

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy / teardown PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview
